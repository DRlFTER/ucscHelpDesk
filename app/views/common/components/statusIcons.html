<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Status Icons</title>
    <link rel="stylesheet" href="../css/components.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="box">

          <h4>Status Icons</h4>

          <div class="status under-review">Under Review</div>
          <div class="status pending">Pending</div>
          <div class="status resolved">Resolved</div>
          <div class="status rejected">Rejected</div>
          <div class="status in-progress">In Progress</div>
          <div class="status open">Open</div>
          <div class="status closed">Closed</div>
          <div class="status requested">Requested</div>
          <div class="status completed">Completed</div>
          <div class="status cancelled">Cancelled</div>
          <div class="status high">High</div>
          <div class="status medium">Medium</div>
          <div class="status low">Low</div>

        </div>
      </div>
    </div>
  </body>
</html>
